<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvin | Management System</title>
    <link rel="icon" href="logo-va.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Menghilangkan scrollbar di halaman utama */
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Iframe otomatis mengambil sisa ruang di atas footer */
        iframe {
            display: block;
            width: 100%;
            flex-grow: 1; 
            border: none;
        }
        
    </style>
</head>
<body>

    <!-- Layar Loading -->
    <div id="loading-screen">
        <img src="logo-va.png" alt="Loading..." class="loading-logo">
    </div>

    <!-- Konten Utama (Iframe) -->
    <iframe src="https://script.google.com/macros/s/AKfycbyldKteLOWvTg_Z9GjMH7cLm2EZn2ACvlvRTZE2sg6C1arBzXm9b7qrP_mYT9a8dsx8/exec" 
            title="Aplikasi Saya"
            onload="hilangkanLoading()">
    </iframe>

</body>
</html>
